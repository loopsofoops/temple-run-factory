name: Build Temple Run v15.1 (Sea of Thieves 3D Water & 8x Dist)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Download Cached APK Parts & Tools
        run: |
          set -e
          mkdir -p cached_parts dump_in dump_out extracted_base split_arm64 jni
          BASE_URL="https://github.com/loopsofoops/temple-run-factory/releases/download/base-apk"
          for i in $(seq -f "%02g" 0 8); do
            curl -sL "$BASE_URL/tr_part_${i}.bin" -o "cached_parts/tr_part_${i}.bin"
          done
          cat cached_parts/tr_part_*.bin > apkm.zip
          unzip -q apkm.zip base.apk split_config.arm64_v8a.apk
          unzip -q split_config.arm64_v8a.apk -d split_arm64
          unzip -q base.apk "classes3.dex" "classes10.dex" "assets/bin/Data/Managed/Metadata/global-metadata.dat" -d extracted_base
          cp split_arm64/lib/arm64-v8a/libil2cpp.so dump_in/libil2cpp.so
          cp extracted_base/assets/bin/Data/Managed/Metadata/global-metadata.dat dump_in/global-metadata.dat

          curl -sL "https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar" -o APKEditor.jar
          curl -sL "https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar" -o baksmali.jar
          curl -sL "https://bitbucket.org/JesusFreke/smali/downloads/smali-2.5.2.jar" -o smali.jar

      - name: Run Il2CppDumper & Auto-Resolve Camera/Fog/Scale Offsets
        run: |
          set -e
          mkdir -p il2cppdumper
          DUMPER_URL="https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip"
          curl -sL "$DUMPER_URL" -o dumper.zip
          unzip -q dumper.zip -d il2cppdumper
          DOTNET_ROLL_FORWARD=Major dotnet il2cppdumper/Il2CppDumper.dll dump_in/libil2cpp.so dump_in/global-metadata.dat dump_out/ < /dev/null || true
          echo "" | base64 -d > resolve_offsets.py
          python3 resolve_offsets.py

      - name: Clean Split Attributes in AndroidManifest.xml
        run: |
          set -e
          mkdir -p split_in manifest_only
          cp base.apk split_in/
          cp split_config.arm64_v8a.apk split_in/
          java -jar APKEditor.jar m -i split_in -o merged_temp.apk
          unzip -q merged_temp.apk AndroidManifest.xml -d manifest_only
          rm -rf split_in merged_temp.apk

      - name: Compile Native C++ Engine (libtrmod.so) & Java Overlay (classes12.dex)
        run: |
          set -e
          echo "" | base64 -d > jni/trmod.cpp
          NDK_DIR="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          CLANGXX=$(find "$NDK_DIR" -name "aarch64-linux-android24-clang++" | head -n 1)
          if [ -z "$CLANGXX" ]; then
            CLANGXX=$(find "$NDK_DIR" -name "aarch64-linux-android*-clang++" | sort | head -n 1)
          fi
          echo "[+] Compiling libtrmod.so with $CLANGXX"
          "$CLANGXX" -shared -fPIC -O2 -std=c++17 -fno-exceptions -fno-rtti -static-libstdc++             jni/trmod.cpp -o libtrmod.so -llog -ldl -lEGL -lGLESv3

          mkdir -p java_src/com/imangi/templerun java_classes
          echo "" | base64 -d > java_src/com/imangi/templerun/FreeCamOverlay.java
          JAVAC_BIN="${JAVA_HOME_17_X64}/bin/javac"
          JAR_BIN="${JAVA_HOME_17_X64}/bin/jar"
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" | sort -V | tail -n 1)
          "$JAVAC_BIN" -source 1.8 -target 1.8 -bootclasspath "$ANDROID_JAR" -classpath "$ANDROID_JAR"             -d java_classes java_src/com/imangi/templerun/FreeCamOverlay.java
          "$JAR_BIN" cf overlay_classes.jar -C java_classes .
          D8_BIN=$(find "$ANDROID_HOME/build-tools" -name "d8" | sort -V | tail -n 1)
          "$D8_BIN" --min-api 24 --lib "$ANDROID_JAR" --output . overlay_classes.jar
          mv classes.dex classes12.dex

      - name: Package, Zipalign & Sign Temple Run v15.1 APK
        run: |
          set -e
          echo "" | base64 -d > package_apk.py
          python3 package_apk.py

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$ZIPALIGN" -P 16 -f 4 unsigned.apk aligned.apk
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey             -keypass android -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Android Debug,O=Android,C=US"
          "$APKSIGNER" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android             --out TempleRun-v15.1-SoT-Water.apk aligned.apk
          ls -lh TempleRun-v15.1-SoT-Water.apk

      - name: Publish APK to GitHub Release (latest-mod)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release create latest-mod --repo "loopsofoops/temple-run-factory" --title "Temple Run v15.1 (Sea of Thieves 3D Water & 8x Dist)" --notes "Automated v15.1 build" || true
          gh release upload latest-mod TempleRun-v15.1-SoT-Water.apk --repo "loopsofoops/temple-run-factory" --clobber
