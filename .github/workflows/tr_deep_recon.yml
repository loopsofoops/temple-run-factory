name: Temple Run Deep Recon (Water, Lighting & Track)

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-24.04
    steps:
      - name: Download Cached Temple Run APK Parts & Extract
        run: |
          set -e
          mkdir -p cached_parts dump_in dump_out extracted_base
          BASE_URL="https://github.com/loopsofoops/temple-run-factory/releases/download/base-apk"
          for i in $(seq -f "%02g" 0 8); do
            curl -sL "$BASE_URL/tr_part_${i}.bin" -o "cached_parts/tr_part_${i}.bin"
          done
          cat cached_parts/tr_part_*.bin > apkm.zip
          unzip -q apkm.zip base.apk split_config.arm64_v8a.apk
          unzip -q split_config.arm64_v8a.apk "lib/arm64-v8a/libil2cpp.so" -d dump_in_tmp
          mv dump_in_tmp/lib/arm64-v8a/libil2cpp.so dump_in/libil2cpp.so
          unzip -q base.apk "assets/bin/Data/*" -d extracted_base
          cp extracted_base/assets/bin/Data/Managed/Metadata/global-metadata.dat dump_in/global-metadata.dat

      - name: Run Il2CppDumper
        run: |
          set -e
          mkdir -p il2cppdumper
          DUMPER_URL=$(curl -s https://api.github.com/repos/Perfare/Il2CppDumper/releases/latest | grep -o 'https://[^"]*Il2CppDumper-net6-[^"]*\.zip' | head -n 1)
          if [ -z "$DUMPER_URL" ]; then
            DUMPER_URL="https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip"
          fi
          curl -sL "$DUMPER_URL" -o dumper.zip
          unzip -q dumper.zip -d il2cppdumper
          DOTNET_ROLL_FORWARD=Major dotnet il2cppdumper/Il2CppDumper.dll dump_in/libil2cpp.so dump_in/global-metadata.dat dump_out/ < /dev/null || true

      - name: Install UnityPy & Execute Deep Recon
        run: |
          pip install -q UnityPy
          echo "" | base64 -d > run_recon.py
          python3 run_recon.py

      - name: Upload Recon Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: temple-run-deep-recon
          path: recon_report.txt
